name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Validate Dagster definitions
        env:
          GCS_BUCKET: ci-placeholder
          GOOGLE_CLOUD_PROJECT: ci-placeholder
          BIGQUERY_DATASET: github
        run: uv run python scripts/validate_defs.py
